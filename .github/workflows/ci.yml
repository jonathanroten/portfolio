# Checks every pull request, and deploys `main` to Cloudflare once the
# checks pass. The deploy uploads the exact site the Web job built.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Markdown, the Sanity Studio (sanity/) and Stacki Studio (studio/)
    # don't change the site, so they don't deploy. Pull requests always run,
    # because a required check that never starts would block the merge.
    paths-ignore: ["**.md", "sanity/**", "studio/**"]
  # Adds a "Run workflow" button on the Actions tab, for redeploying after
  # publishing in Sanity (the site only picks up content when it's built).
  workflow_dispatch:

# The default token can read the code and nothing else.
permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Astro's image cache. Restored after `npm ci`, which empties
      # node_modules. Each run saves a fresh copy, and the next run starts
      # from the newest one, so only new or changed images are downloaded.
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ github.run_id }}
          restore-keys: astro-${{ runner.os }}-
      # `--no` fails instead of downloading a tool that isn't installed.
      # `--` stops npm reading the tool's own flags (like --check) as its own.
      - run: npx --no -- prettier --check .
      - run: npm run check
      # Sanity's image server occasionally answers a download with an error
      # (like 502). Astro caches each image as soon as it's processed, so
      # the second try only fetches what failed.
      - name: Build (retries once)
        run: npm run build || { echo "::warning::Build failed, retrying once"; npm run build; }
      # Hands the built site to the Deploy job. Only `main` deploys.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  sanity:
    name: Sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sanity
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: sanity/package-lock.json
      - run: npm ci
      - run: npx --no -- tsc --noEmit
      - run: npx --no -- eslint .

  deploy:
    name: Deploy
    needs: [web, sanity]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare secrets live in this environment, which only `main`
    # can use, so pull request runs can never read them.
    environment:
      name: production
      url: https://portfolio.jonathanroten.workers.dev
    # One deploy at a time. A newer one waits instead of cancelling a
    # deploy halfway through.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Uploads the Worker and the built site. The Worker's own secrets
      # (CONTACT_TO, TURNSTILE_SECRET_KEY) stay as they are on Cloudflare.
      - run: npx --no -- wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
